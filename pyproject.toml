[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aidetector"
version = "0.1.0"
description = "AI-Generated Image Detection using Classical Forensics and CNN features"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "SE Project Team" }
]
dependencies = [
    "numpy>=2.0.0",
    "scipy>=1.15.0",
    "scikit-learn>=1.6.0",
    "opencv-python-headless>=4.10.0",
    "pillow>=11.0.0",
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "joblib>=1.4.0",
    "pyyaml>=6.0.0",
    "pyarrow>=18.0.0",
    "pandas>=2.2.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0"
]

[project.scripts]
aidetector = "aidetector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["aidetector*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

